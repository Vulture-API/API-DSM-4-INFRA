# Ambiente local completo da plataforma (Equipe Vulture — API 4º DSM).
#
#   docker compose up -d --build        sobe tudo
#   node scripts/e2e.mjs                testa o fluxo inteiro
#   docker compose down                 para
#
# SERVICES_DIR diz de onde vem o código de cada serviço:
#   ./services  (padrão)  os submodules deste repositório, na branch dev
#   ..                    as pastas irmãs, ex.: C:\...\API4\API-DSM-4-USUARIO
#
# O PostgreSQL é externo/online.
# Configure DATABASE_URL no arquivo .env.
#
# Exemplo:
# DATABASE_URL=postgresql://usuario:senha@host:5432/banco?sslmode=require
#
# Não commite credenciais no Git.

name: vulture

# Saudável = o servidor HTTP responde (qualquer status < 500).
x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
  # --------------------------------------------------------------------------
  # Infraestrutura
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2

    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "localhost",
          "-t",
          "healthcheck",
          "-m",
          "ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------------------
  # Microsserviços (Node 24 / Fastify)
  # --------------------------------------------------------------------------
  api-usuario:
    restart: unless-stopped
    build: ${SERVICES_DIR:-./services}/API-DSM-4-USUARIO

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]

  api-parametros:
    restart: unless-stopped
    build: ${SERVICES_DIR:-./services}/API-DSM-4-PARAMETROS

    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "127.0.0.1:3001:3001"

    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]

  api-alertas:
    restart: unless-stopped
    build: ${SERVICES_DIR:-./services}/API-DSM-4-ALERTAS

    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}

      RULES_ENGINE_ENABLED: "true"
      RULES_ENGINE_INTERVAL_MS: 5000
      RULES_ENGINE_BATCH_SIZE: 500

    ports:
      - "127.0.0.1:3002:3002"

    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]

  api-estacoes:
    restart: unless-stopped
    build: ${SERVICES_DIR:-./services}/API-DSM-4-ESTACOES

    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: ${DATABASE_URL}
      STATION_OFFLINE_THRESHOLD_MINUTES: 10

    ports:
      - "127.0.0.1:3005:3005"

    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3005/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]

  # --------------------------------------------------------------------------
  # Recepção de dados (Python): MQTT -> Redis Stream -> PostgreSQL online
  # --------------------------------------------------------------------------
  recepcao:
    build: ${SERVICES_DIR:-./services}/API-DSM-4-RECEPCAO-DADOS
    command: ["ingest"]

    environment:
      INGEST_MQTT_HOST: mosquitto
      INGEST_MQTT_CLIENT_ID: station-ingest-local
      INGEST_REDIS_URL: redis://redis:6379/0
      INGEST_LOG_LEVEL: INFO

    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  recepcao-persist:
    build: ${SERVICES_DIR:-./services}/API-DSM-4-RECEPCAO-DADOS
    command: ["persist"]

    environment:
      INGEST_REDIS_URL: redis://redis:6379/0
      INGEST_DATABASE_URL: ${DATABASE_URL}
      INGEST_LOG_LEVEL: INFO

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Front-end (Next.js)
  # --------------------------------------------------------------------------
  frontend:
    restart: unless-stopped

    build:
      context: ${SERVICES_DIR:-./services}/API-DSM-4-FRONTEND/app

      args:
        USERS_API_URL: http://api-usuario:3000
        PARAMETERS_API_URL: http://api-parametros:3001
        ALERTS_API_URL: http://api-alertas:3002
        STATIONS_API_URL: http://api-estacoes:3005

    ports:
      - "127.0.0.1:3010:3010"

    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3010/dashboard').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]

    depends_on:
      api-usuario:
        condition: service_healthy
      api-parametros:
        condition: service_healthy
      api-alertas:
        condition: service_healthy
      api-estacoes:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Reverse Proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      frontend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/dashboard || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # --------------------------------------------------------------------------
  # Simulador das estações de demonstração
  # --------------------------------------------------------------------------
  simulador:
    image: node:24-alpine
    restart: unless-stopped

    command: ["node", "/scripts/simulador.mjs"]

    environment:
      MQTT_HOST: mosquitto
      SIMULADOR_INTERVALO_S: 60

    volumes:
      - ./scripts:/scripts:ro

    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  redis_data: