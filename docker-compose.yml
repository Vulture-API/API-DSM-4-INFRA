# Ambiente local completo da plataforma (Equipe Vulture — API 4º DSM).
#
#   docker compose up -d --build        sobe tudo
#   node scripts/e2e.mjs                testa o fluxo inteiro
#   docker compose down                 para
#
# SERVICES_DIR diz de onde vem o código de cada serviço:
#   ./services  (padrão)  os commits fixados dos submodules deste repositório
#   ..                    as pastas irmãs, ex.: C:\...\API4\API-DSM-4-BACKEND
#
# O PostgreSQL é externo/online.
# Configure DATABASE_URL no arquivo .env.
#
# Exemplo:
# DATABASE_URL=postgresql://usuario:senha@host:5432/banco?sslmode=require
#
# Não commite credenciais no Git.

name: vulture

# Intervalos compartilhados dos healthchecks HTTP.
x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
  # --------------------------------------------------------------------------
  # Infraestrutura
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2

    ports:
      - "${MQTT_PORT:-1883}:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "localhost",
          "-t",
          "healthcheck",
          "-m",
          "ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backend monolítico (Node 24 / Fastify)
  backend:
    restart: unless-stopped
    build: ${SERVICES_DIR:-./services}/API-DSM-4-BACKEND
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-}
      STATION_OFFLINE_THRESHOLD_MINUTES: 10
      RULES_ENGINE_ENABLED: "true"
      RULES_ENGINE_INTERVAL_MS: 5000
      RULES_ENGINE_BATCH_SIZE: 500
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    healthcheck:
      <<: *node-healthcheck
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]

  # --------------------------------------------------------------------------
  # Recepção de dados (Python): MQTT -> Redis Stream -> PostgreSQL online
  # --------------------------------------------------------------------------
  recepcao:
    build: ${SERVICES_DIR:-./services}/API-DSM-4-RECEPCAO-DADOS
    command: ["ingest"]

    environment:
      INGEST_MQTT_HOST: mosquitto
      INGEST_MQTT_CLIENT_ID: station-ingest-local
      INGEST_REDIS_URL: redis://redis:6379/0
      INGEST_LOG_LEVEL: INFO

    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  recepcao-persist:
    build: ${SERVICES_DIR:-./services}/API-DSM-4-RECEPCAO-DADOS
    command: ["persist"]

    environment:
      INGEST_REDIS_URL: redis://redis:6379/0
      INGEST_DATABASE_URL: ${DATABASE_URL:-}
      INGEST_LOG_LEVEL: INFO

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Front-end (Next.js)
  # --------------------------------------------------------------------------
  frontend:
    restart: unless-stopped

    build:
      context: ${SERVICES_DIR:-./services}/API-DSM-4-FRONTEND/app

      args:
        USERS_API_URL: http://backend:3000
        PARAMETERS_API_URL: http://backend:3000
        ALERTS_API_URL: http://backend:3000
        STATIONS_API_URL: http://backend:3000

    ports:
      - "127.0.0.1:3010:3010"

    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3010/dashboard').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]

    depends_on:
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Reverse Proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      frontend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/dashboard || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # --------------------------------------------------------------------------
  # Simulador das estações de demonstração
  # --------------------------------------------------------------------------
  simulador:
    image: node:24-alpine
    restart: unless-stopped

    command: ["node", "/scripts/simulador.mjs"]

    environment:
      MQTT_HOST: mosquitto
      SIMULADOR_INTERVALO_S: 60
      STATIONS_API_URL: http://backend:3000
      PARAMETERS_API_URL: http://backend:3000

    volumes:
      - ./scripts:/scripts:ro

    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  redis_data:
