# Ambiente descartável: nunca usa a DATABASE_URL externa.
# docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
name: vulture-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agritech_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ${SERVICES_DIR:-./services}/API-DSM-4-BANCO/setup/schema-neon.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${SERVICES_DIR:-./services}/API-DSM-4-BANCO/setup/seed-dev.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agritech_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agritech_test
    depends_on:
      postgres:
        condition: service_healthy

  recepcao-persist:
    environment:
      INGEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agritech_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_test_data:
