# Valida os commits fixados com PostgreSQL descartável, sem acessar o banco externo.
name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5" # 07h em Brasília, dias úteis

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
    name: Ambiente completo + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Versões testadas
        run: git submodule foreach --quiet 'echo "$name $(git rev-parse --short HEAD)"'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar simulador e configuração
        run: |
          node --test scripts/simulador.test.mjs
          docker compose config --quiet

      - name: Subir ambiente
        run: docker compose up -d --build --wait

      - name: Teste ponta a ponta
        run: node scripts/e2e.mjs

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derrubar
        if: always()
        run: docker compose down -v
