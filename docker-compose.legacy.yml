# Ensaio controlado somente: imagem congelada, nunca fallback automático.
services:
  recepcao-persist:
    profiles: [legacy-rehearsal]
    image: vulture-recepcao-legacy:4d83b0382b838e0a6f63c37edd365e6d761b2ca1
    pull_policy: never
    command: [persist]
    environment:
      INGEST_REDIS_URL: redis://redis:6379/0
      INGEST_REDIS_STREAM: ${TELEMETRY_STREAM:-telemetry:ingest}
      INGEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agritech_test
      INGEST_PERSIST_GROUP: ${PERSIST_GROUP:-postgres-persister}
      INGEST_PERSIST_CONSUMER: legacy-rehearsal
    restart: "no"
