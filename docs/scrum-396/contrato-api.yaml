openapi: 3.0.3

info:
  title: API de Monitoramento IoT (Estações e Sensores)
  version: 1.7.0
  description: >
    Contrato de API RESTful revisado com suporte a paginação,
    autenticação JWT, operações CRUD completas, endpoints em inglês
    e proteção contra fraudes e conflitos de chave única.

servers:
  - url: https://api.exemplo.com/v1
    description: Servidor de Produção

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Users
  - name: Roles
  - name: Properties
  - name: Stations
  - name: Sensors
  - name: Sensor Types
  - name: Readings
  - name: Alerts

paths:
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Consultar identidade, permissões e escopo atuais
      description: JWT identifica somente o usuário. Perfil, permissões e vínculos são consultados novamente no banco.
      responses:
        '200':
          description: Identidade atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}/properties:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    get:
      tags:
      - Users
      summary: Consultar vínculos de propriedades (somente Administrador)
      description: Exige autenticação e users.read mesmo no modo legado.
      responses:
        '200': &id001
          description: Propriedades vinculadas ao usuário (não representa o escopo global do Administrador).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProperty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Users
      summary: Substituir vínculos de propriedades (somente Administrador)
      description: Exige autenticação e users.update mesmo no modo legado. A substituição é atômica; [] remove todos
        os vínculos; IDs repetidos são normalizados. Usuário ou propriedade inexistente retorna 404 sem alterar a
        lista anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserProperties'
      responses:
        '200': *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  /auth/login:
    post:
      summary: Autenticação de usuário
      tags:
        - Authentication
      security: [] # Endpoint público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      summary: Lista usuários paginados
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPaginated'
    post:
      summary: Cria um novo usuário (e credenciais)
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}:
    get:
      summary: Busca um usuário por ID
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza um usuário existente
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Exclui um usuário
      description: Pode retornar erro de conflito caso o usuário seja dono de propriedades (ON DELETE RESTRICT).
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Excluído com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}/credentials:
    patch:
      summary: Atualiza as credenciais (senha) do usuário
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsUpdateInput'
      responses:
        '200':
          description: Senha atualizada com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles:
    get:
      summary: Lista cargos
      tags:
        - Roles
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      summary: Cria um novo cargo
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '409':
          $ref: '#/components/responses/Conflict'

  /roles/{id}:
    get:
      summary: Busca cargo por ID
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza um cargo
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Exclui um cargo
      description: Bloqueado se houver usuários associados ao cargo (ON DELETE RESTRICT).
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /properties:
    get:
      summary: Lista propriedades paginadas
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesPaginated'
    post:
      summary: Cadastra uma nova propriedade
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'

  /properties/{id}:
    get:
      summary: Busca propriedade por ID
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza uma propriedade
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '200':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Exclui uma propriedade
      description: A exclusão de propriedade exclui em cascata suas estações (ON DELETE CASCADE).
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  /stations:
    get:
      summary: Lista estações paginadas
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: property_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationsPaginated'
    post:
      summary: Registra uma nova estação
      tags:
        - Stations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '409':
          $ref: '#/components/responses/Conflict'

  /stations/{id}:
    get:
      summary: Busca estação por ID
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza estação
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationInput'
      responses:
        '200':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Exclui estação
      description: A exclusão de estação exclui sensores em cascata (ON DELETE CASCADE).
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'


  /stations/{id}/status:
    get:
      summary: Consulta o status de comunicação da estação
      description: >
        Calcula o status com base no intervalo desde last_communication_at.
        A estação permanece Online até o limite configurado pelo servidor,
        inclusive, e fica Offline quando o limite é ultrapassado ou quando
        nunca houve comunicação.
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Status de comunicação calculado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/current:
    get:
      summary: Consulta os dados meteorológicos atuais das estações
      description: >
        Última leitura consistente de cada sensor, agrupada por estação, com o
        status de comunicação e a data/hora da última atualização. Sensores sem
        leitura aparecem com value e unix_time nulos. Para receber as novas
        leituras em tempo real, use o WebSocket /stations/current/ws.
      tags:
        - Stations
      parameters:
        - name: station_id
          in: query
          required: false
          schema:
            type: integer
        - name: property_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Dados atuais das estações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{id}/current:
    get:
      summary: Consulta os dados meteorológicos atuais de uma estação
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Dados atuais da estação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/current/ws:
    get:
      summary: WebSocket com as novas leituras
      description: >
        Conexão WebSocket (upgrade HTTP). A cada leitura consistente gravada,
        o servidor envia uma mensagem JSON no formato CurrentReadingEvent.
        Com station_id, envia só as leituras dessa estação.
      tags:
        - Stations
      parameters:
        - name: station_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '101':
          description: Conexão trocada para WebSocket
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/statistics:
    get:
      summary: Estatísticas meteorológicas por tipo de sensor
      description: >
        Contagem, média, mínimo, máximo e desvio padrão das leituras
        consistentes no período [from, to). Sem from/to, usa os últimos 7 dias.
        O período vai até 366 dias e from deve ser anterior a to; caso
        contrário, 400 com code INVALID_PERIOD.
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: property_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Estatísticas do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stations/{id}/statistics:
    get:
      summary: Estatísticas meteorológicas de uma estação
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Estatísticas do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{id}/forecast:
    get:
      summary: Previsão meteorológica diária para a posição da estação
      description: >
        Previsão do Open-Meteo para a latitude e longitude da estação, em
        cache por 30 minutos por posição.
      tags:
        - Stations
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 7
            default: 7
      responses:
        '200':
          description: Previsão diária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationForecast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sensors:
    get:
      summary: Lista sensores paginados
      tags:
        - Sensors
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: station_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorsPaginated'
    post:
      summary: Vincula um novo sensor a uma estação
      tags:
        - Sensors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '409':
          $ref: '#/components/responses/Conflict'

  /sensors/{id}:
    get:
      summary: Busca sensor por ID
      tags:
        - Sensors
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza sensor
      tags:
        - Sensors
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorInput'
      responses:
        '200':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Exclui sensor
      description: A exclusão de sensor exclui leituras em cascata (ON DELETE CASCADE).
      tags:
        - Sensors
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  /sensor-types:
    get:
      summary: Lista tipos de sensor
      tags:
        - Sensor Types
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensorType'
    post:
      summary: Cria um tipo de sensor
      tags:
        - Sensor Types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorTypeInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorType'
        '409':
          $ref: '#/components/responses/Conflict'

  /sensor-types/{id}:
    get:
      summary: Busca tipo de sensor por ID
      tags:
        - Sensor Types
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorType'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza tipo de sensor
      tags:
        - Sensor Types
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorTypeInput'
      responses:
        '200':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Exclui tipo de sensor
      description: Bloqueado se houver sensores associados a este tipo (ON DELETE RESTRICT).
      tags:
        - Sensor Types
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /readings:
    get:
      summary: Obtém o histórico de leituras (Paginado)
      tags:
        - Readings
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: sensor_id
          in: query
          required: false
          schema:
            type: integer
        - name: start_unix_time
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: end_unix_time
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsPaginated'
  /alerts/config:
    get:
      summary: Lista configurações de alertas paginadas
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: sensor_id
          in: query
          required: false
          schema:
            type: integer
        - name: manager_user_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertConfigsPaginated'
    post:
      summary: Cria uma configuração de alerta
      tags:
        - Alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertConfigInput'
      responses:
        '201':
          description: Configuração criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertConfig'

  /alerts/config/{id}:
    get:
      summary: Busca configuração por ID
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertConfig'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza configuração de alerta
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertConfigInput'
      responses:
        '200':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Exclui configuração de alerta
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  /alerts/triggered:
    get:
      summary: Lista alertas disparados (Paginado)
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: acknowledged
          in: query
          required: false
          description: Filtra alertas reconhecidos (true) ou não reconhecidos (false).
          schema:
            type: boolean
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggeredAlertsPaginated'

  /alerts/triggered/{id}/acknowledge:
    put:
      summary: Reconhece um alerta
      description: O corpo da requisição está intencionalmente vazio. O ID do usuário que reconhece o alerta será extraído pelo backend através do Token JWT no cabeçalho Authorization para garantir a segurança.
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Alerta reconhecido com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggeredAlert'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Número da página atual
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Quantidade de registros por página
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FromParam:
      name: from
      in: query
      required: false
      description: Início do período (ISO 8601). Padrão, 7 dias antes de to.
      schema:
        type: string
        format: date-time

    ToParam:
      name: to
      in: query
      required: false
      description: Fim do período, exclusivo (ISO 8601). Padrão, agora.
      schema:
        type: string
        format: date-time

  responses:
    Forbidden:
      description: Usuário autenticado sem permissão ou sem perfil Administrador para
        gerir vínculos. Cliente não pode escrever, mesmo com concessão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    BadRequest:
      description: Requisição inválida (Erro de Validação)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Não autorizado (Token ausente ou inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflito de dados (Violação de chave única ou restrição de exclusão)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Requisição válida, mas o recurso não permite a operação (ex. estação sem coordenadas)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Serviço externo indisponível (ex. provedor de previsão)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    UserProperty:
      type: object
      required:
      - id
      - name
      - location
      - owner_user_id
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
          nullable: true
        owner_user_id:
          type: integer
    ReplaceUserProperties:
      type: object
      additionalProperties: false
      required:
      - property_ids
      properties:
        property_ids:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
    AccessIdentity:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - permissions
        - role_name
        - property_ids
        properties:
          permissions:
            type: array
            items:
              type: string
          role_name:
            type: string
          property_ids:
            type: array
            nullable: true
            items:
              type: integer
            description: 'null: Administrador com escopo global; []: nenhum vínculo; lista: propriedades permitidas.'


    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        details:
          type: array
          items:
            type: string

    PaginationMeta:
      type: object
      properties:
        total_records:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Tempo em segundos

    # Schemas Paginados Genéricos
    UsersPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PropertiesPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    StationsPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Station'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SensorsPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sensor'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ReadingsPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AlertConfigsPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlertConfig'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TriggeredAlertsPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TriggeredAlert'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # Entidades Base
    User:
      type: object
      required: [id, role_id, name, email, active, created_at]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        role_id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true

    UserInput:
      type: object
      required: [role_id, name, email, password]
      properties:
        role_id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          description: Cria a credencial atrelada ao usuário
        password:
          type: string
          format: password
          minLength: 8
        active:
          type: boolean
          default: true

    UserUpdate:
      type: object
      required: [role_id, name, active]
      properties:
        role_id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 150
        active:
          type: boolean

    CredentialsUpdateInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    Role:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        name:
          type: string
          maxLength: 50
        description:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true

    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          nullable: true
          maxLength: 255

    Property:
      type: object
      required: [id, name, owner_user_id, created_at]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        name:
          type: string
          maxLength: 100
        owner_user_id:
          type: integer
          format: int32
        location:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true

    PropertyInput:
      type: object
      required: [name, owner_user_id]
      properties:
        name:
          type: string
          maxLength: 100
        owner_user_id:
          type: integer
          format: int32
        location:
          type: string
          nullable: true
          maxLength: 255

    Station:
      type: object
      required: [id, property_id, mac_address, name, created_at]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        property_id:
          type: integer
          format: int32
        mac_address:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        last_communication_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true


    StationStatus:
      type: object
      required:
        - station_id
        - status
        - last_communication_at
        - checked_at
        - offline_threshold_minutes
      properties:
        station_id:
          type: integer
          format: int32
          readOnly: true
        status:
          type: string
          enum: [Online, Offline]
          readOnly: true
        last_communication_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        checked_at:
          type: string
          format: date-time
          readOnly: true
        offline_threshold_minutes:
          type: integer
          minimum: 1
          example: 10
          readOnly: true
      example:
        station_id: 1
        status: Online
        last_communication_at: '2026-09-23T22:40:00.000Z'
        checked_at: '2026-09-23T22:49:00.000Z'
        offline_threshold_minutes: 10

    CurrentReading:
      type: object
      required: [sensor_id, local_identifier, sensor_type_id, sensor_type, unit_of_measure, value, unix_time]
      properties:
        sensor_id:
          type: integer
        local_identifier:
          type: string
        sensor_type_id:
          type: integer
        sensor_type:
          type: string
        unit_of_measure:
          type: string
        value:
          type: number
          format: double
          nullable: true
        unix_time:
          type: integer
          format: int64
          nullable: true

    StationCurrentData:
      type: object
      required: [station_id, name, property_id, property_name, status, last_update, readings]
      properties:
        station_id:
          type: integer
        name:
          type: string
        property_id:
          type: integer
        property_name:
          type: string
        status:
          type: string
          enum: [Online, Com alerta, Offline]
        last_update:
          type: string
          format: date-time
          nullable: true
        readings:
          type: array
          items:
            $ref: '#/components/schemas/CurrentReading'

    CurrentData:
      type: object
      required: [generated_at, offline_threshold_minutes, stations]
      properties:
        generated_at:
          type: string
          format: date-time
        offline_threshold_minutes:
          type: integer
        stations:
          type: array
          items:
            $ref: '#/components/schemas/StationCurrentData'

    CurrentReadingEvent:
      description: Mensagem enviada pelo WebSocket /stations/current/ws.
      type: object
      required: [type, reading_id, station_id, sensor_id, sensor_type, unit_of_measure, value, unix_time]
      properties:
        type:
          type: string
          enum: [reading]
        reading_id:
          type: integer
          format: int64
        station_id:
          type: integer
        sensor_id:
          type: integer
        local_identifier:
          type: string
        sensor_type_id:
          type: integer
        sensor_type:
          type: string
        unit_of_measure:
          type: string
        value:
          type: number
          format: double
        unix_time:
          type: integer
          format: int64

    SensorTypeStatistics:
      type: object
      required: [sensor_type_id, sensor_type, unit_of_measure, count, avg, min, max, stddev, first_reading_at, last_reading_at]
      properties:
        sensor_type_id:
          type: integer
        sensor_type:
          type: string
        unit_of_measure:
          type: string
        count:
          type: integer
        avg:
          type: number
          format: double
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        stddev:
          type: number
          format: double
          nullable: true
          description: Nulo com menos de duas leituras no período.
        first_reading_at:
          type: string
          format: date-time
        last_reading_at:
          type: string
          format: date-time

    Statistics:
      type: object
      required: [from, to, station_id, property_id, readings_total, sensor_types]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        station_id:
          type: integer
          nullable: true
        property_id:
          type: integer
          nullable: true
        readings_total:
          type: integer
        sensor_types:
          type: array
          items:
            $ref: '#/components/schemas/SensorTypeStatistics'

    ForecastDay:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        temperature_max:
          type: number
          nullable: true
          description: °C
        temperature_min:
          type: number
          nullable: true
          description: °C
        precipitation_mm:
          type: number
          nullable: true
        precipitation_probability:
          type: integer
          nullable: true
          description: '%'
        wind_speed_max_kmh:
          type: number
          nullable: true
        weather_code:
          type: integer
          nullable: true
          description: Código WMO (0 = céu limpo)

    StationForecast:
      type: object
      required: [station_id, latitude, longitude, source, generated_at, days]
      properties:
        station_id:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        source:
          type: string
          example: open-meteo
        generated_at:
          type: string
          format: date-time
        days:
          type: array
          items:
            $ref: '#/components/schemas/ForecastDay'

    StationInput:
      type: object
      required: [property_id, mac_address, name]
      properties:
        property_id:
          type: integer
          format: int32
        mac_address:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true

    Sensor:
      type: object
      required: [id, station_id, sensor_type_id, local_identifier, operational_status, created_at]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        station_id:
          type: integer
          format: int32
        sensor_type_id:
          type: integer
          format: int32
        local_identifier:
          type: string
          maxLength: 50
        operational_status:
          type: boolean
        gain:
          type: number
          format: double
          nullable: true
          description: Ganho de calibração deste sensor. Diferente de zero. Nulo usa o do tipo.
        offset_value:
          type: number
          format: double
          nullable: true
          description: Offset de calibração deste sensor. Nulo usa o do tipo.
        model:
          type: string
          maxLength: 100
          nullable: true
          description: Modelo ou fabricante do sensor instalado.
        created_at:
          type: string
          format: date-time
          readOnly: true

    SensorInput:
      type: object
      required: [station_id, sensor_type_id, local_identifier]
      properties:
        station_id:
          type: integer
          format: int32
        sensor_type_id:
          type: integer
          format: int32
        local_identifier:
          type: string
          maxLength: 50
        operational_status:
          type: boolean
          default: true
        gain:
          type: number
          format: double
          nullable: true
          description: Ganho de calibração deste sensor. Diferente de zero. Nulo usa o do tipo.
        offset_value:
          type: number
          format: double
          nullable: true
          description: Offset de calibração deste sensor. Nulo usa o do tipo.
        model:
          type: string
          maxLength: 100
          nullable: true
          description: Modelo ou fabricante do sensor instalado.

    SensorType:
      type: object
      required: [id, name, unit_of_measure]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        name:
          type: string
          maxLength: 50
        unit_of_measure:
          type: string
          maxLength: 20
        factor:
          type: number
          format: double
          nullable: true
        gain:
          type: number
          format: double
          nullable: true
        offset_value:
          type: number
          format: double
          nullable: true
          description: Offset padrão do tipo. valor = bruto × factor × gain + offset_value; campo nulo não altera a leitura.

    SensorTypeInput:
      type: object
      required: [name, unit_of_measure]
      properties:
        name:
          type: string
          maxLength: 50
        unit_of_measure:
          type: string
          maxLength: 20
        factor:
          type: number
          format: double
          nullable: true
        gain:
          type: number
          format: double
          nullable: true
        offset_value:
          type: number
          format: double
          nullable: true
          description: Offset padrão do tipo. valor = bruto × factor × gain + offset_value; campo nulo não altera a leitura.

    Reading:
      type: object
      required: [id, sensor_id, value, unix_time, data_consistent, created_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        sensor_id:
          type: integer
          format: int32
        value:
          type: number
          format: double
        unix_time:
          type: integer
          format: int64
        data_consistent:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true

    AlertConfig:
      type: object
      required: [id, sensor_id, reference_value, comparison_operator, active, created_at]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        manager_user_id:
          type: integer
          format: int32
          nullable: true
        sensor_id:
          type: integer
          format: int32
        reference_value:
          type: number
          format: double
        comparison_operator:
          type: string
          enum: [">", "<", ">=", "<=", "=", "!="]
        message:
          type: string
          nullable: true
          maxLength: 200
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true

    AlertConfigInput:
      type: object
      required: [sensor_id, reference_value, comparison_operator]
      properties:
        manager_user_id:
          type: integer
          format: int32
          nullable: true
        sensor_id:
          type: integer
          format: int32
        reference_value:
          type: number
          format: double
        comparison_operator:
          type: string
          enum: [">", "<", ">=", "<=", "=", "!="]
        message:
          type: string
          nullable: true
          maxLength: 200
        active:
          type: boolean
          default: true

    TriggeredAlert:
      type: object
      required: [id, alert_config_id, reading_id, triggered_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        alert_config_id:
          type: integer
          format: int32
        reading_id:
          type: integer
          format: int64
        acknowledged_by:
          type: integer
          format: int32
          nullable: true
        triggered_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true